<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF" />
      <stop offset="1" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="gownGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
  </defs>

  <rect width="480" height="600" rx="28" fill="url(#bgGrad)" />

  <!-- soft backdrop disc behind the figure -->
  <circle cx="240" cy="290" r="170" fill="#ffffff" fill-opacity="0.45" />

  <!-- shadow under figure -->
  <ellipse cx="240" cy="560" rx="120" ry="16" fill="#172554" fill-opacity="0.08" />

  <!-- gown -->
  <path
    d="M150 560
       C150 430 180 345 240 345
       C300 345 330 430 330 560
       Z"
    fill="url(#gownGrad)"
  />

  <!-- gown collar -->
  <path d="M212 352 C212 372 268 372 268 352 L262 388 L218 388 Z" fill="#101d42" />

  <!-- sash -->
  <path d="M214 366 L268 560 L290 560 L244 356 Z" fill="#6D5AE6" />
  <circle cx="226" cy="372" r="7" fill="#F8FAFC" />

  <!-- neck -->
  <rect x="218" y="312" width="44" height="34" rx="10" fill="#E8C8A6" />

  <!-- head -->
  <circle cx="240" cy="272" r="54" fill="#F2D3AE" />

  <!-- mortarboard -->
  <g>
    <rect x="229" y="238" width="22" height="36" rx="4" fill="#111827" />
    <path d="M150 220 L240 182 L330 220 L240 258 Z" fill="#111827" />
    <ellipse cx="240" cy="220" rx="46" ry="11" fill="#1f2937" />
    <circle cx="240" cy="258" r="7" fill="#6D5AE6" />
    <line x1="240" y1="258" x2="240" y2="282" stroke="#6D5AE6" stroke-width="2.5" />
  </g>
</svg>
